<!DOCTYPE html>
<html lang="japanese">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cards</title>
    <script defer src="cards.js"></script>
    <link rel="stylesheet" href="cards.css" />
  </head>
  <body>
    <div class="card-swiper">
      <div class="card-groups">
        <div class="card-group" data-index="0" data-statuts="active">
          <div class="little-card card"></div>
          <div class="big-card card">太宰 治</div>
          <div class="little-card card"></div>
          <div class="big-card card">太宰 治</div>
          <div class="little-card card"></div>
          <div class="big-card card">太宰 治</div>
          <div class="little-card card"></div>
          <div class="big-card card">太宰 治</div>
        </div>

        <div class="card-group" data-index="2" data-statuts="unknown">
          <div class="little-card card"></div>
          <div class="big-card card">太宰 治</div>
          <div class="little-card card"></div>
          <div class="big-card card">太宰 治</div>
          <div class="little-card card"></div>
          <div class="big-card card">太宰 治</div>
          <div class="little-card card"></div>
          <div class="big-card card">太宰 治</div>
        </div>

        <div class="card-group" data-index="2" data-statuts="unknown">
          <div class="little-card card"></div>
          <div class="big-card card">太宰 治</div>
          <div class="little-card card"></div>
          <div class="big-card card">太宰 治</div>
          <div class="little-card card"></div>
          <div class="big-card card">太宰 治</div>
          <div class="little-card card"></div>
          <div class="big-card card">太宰 治</div>
        </div>
      </div>
      <div class="card-swiper-buttons">
        <button id="hate-button" onclick="handleHateClick()">
          <i class="fa-solid fa-x"></i>
        </button>
        <button id="love-button" onclick="handleLoveClick()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <path
              d="M47.6 300.4L228.3 469.1c7.5 7 17.4 10.9 27.7 10.9s20.2-3.9 27.7-10.9L464.4 300.4c30.4-28.3 47.6-68 47.6-109.5v-5.8c0-69.9-50.5-129.5-119.4-141C347 36.5 300.6 51.4 268 84L256 96 244 84c-32.6-32.6-79-47.5-124.6-39.9C50.5 55.6 0 115.2 0 185.1v5.8c0 41.5 17.2 81.2 47.6 109.5z"
            />
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
