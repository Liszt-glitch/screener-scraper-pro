<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <title>Login Form Design</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
  </head>
  <body>
    <div class="loginbox">
      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTpKTLtTKFX-0szpyyRkS46aoi6r-QMFiy1-hd59gVWPAsh5MNkz27smUB19ML2Ky1afzE&usqp=CAU"
        class="avatar"
      />
      <div class="error" class="errors">
        <h1>Login Here</h1>
        <form id="form" action="#" method="GET">
          <p>Username</p>
          <input
            type="text"
            name="enter username"
            id="username"
            placeholder="Enter Username"
            required
          />
          <p>Password</p>
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Enter Password"
            required
          />
          <input type="submit" value="Login" onclick="auth()" />
          <a href="#">Forgot your password?</a><br />
          <a href="#">Don't have an account?</a>
        </form>
      </div>
    </div>
  </body>
</html>
