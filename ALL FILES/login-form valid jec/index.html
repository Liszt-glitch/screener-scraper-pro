<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In Form</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
  </head>
  <body>
    <img src="/232.png" />
    <h1>Log in to Continue</h1>
    <div id="error"></div>
    <div class="container">
      <form id="form" action="#" method="get">
        <label for="user">Enter Username:</label>
        <input type="text" id="email" required /><br /><br />
        <label for="user">Enter Password:</label>
        <input type="password" id="password" required /><br /><br />
        <input type="submit" value="Forgot password" /><br /><br />
        <input type="submit" a href="#" value="Sign Up" id="sign1" />
        <input type="submit" a href="#" value="Sign In" id="sign2" />
        <div class="field">
          <br />
          <input
            type="submit"
            value="Login"
            class="submit-btn"
            onclick="auth()"
          />
        </div>
      </form>
    </div>
  </body>
</html>
